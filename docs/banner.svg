<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EventX — High-Concurrency Event Ticket Booking Platform">
  <title>EventX — High-Concurrency Event Ticket Booking Platform</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="50%" stop-color="#10112c"/>
      <stop offset="100%" stop-color="#1b1145"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#1f2743"/>
    </linearGradient>

    <linearGradient id="thumb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="thumb3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="thumb4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="ticketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity="0.06"/>
    </pattern>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="groundBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="16" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ticketShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <circle cx="1010" cy="55" r="220" fill="url(#glowCyan)" filter="url(#softBlur)"/>
  <circle cx="120" cy="390" r="200" fill="url(#glowMagenta)" filter="url(#softBlur)"/>

  <!-- Left: copy -->
  <text x="70" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#38bdf8">FULL-STACK PORTFOLIO PROJECT</text>

  <text x="66" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="url(#titleGrad)">EventX</text>

  <text x="70" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">High-Concurrency Event Booking Platform</text>

  <text x="70" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Real-time seat locks &#183; zero double-booking guarantee &#183; QR e-tickets</text>
  <text x="70" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Built with React, TypeScript, Node.js &amp; Server-Sent Events</text>

  <!-- tech pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
    <rect x="70" y="298" width="90" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="115" y="319" text-anchor="middle">React 18</text>

    <rect x="172" y="298" width="108" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="226" y="319" text-anchor="middle">TypeScript</text>

    <rect x="292" y="298" width="86" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="335" y="319" text-anchor="middle">Node.js</text>

    <rect x="390" y="298" width="128" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="454" y="319" text-anchor="middle">Tailwind CSS</text>

    <rect x="530" y="298" width="62" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="561" y="319" text-anchor="middle">Vite</text>
  </g>

  <!-- grounding shadow for mockup -->
  <ellipse cx="900" cy="352" rx="175" ry="16" fill="#000000" opacity="0.4" filter="url(#groundBlur)"/>

  <!-- Right: 3D tilted browser mockup -->
  <g transform="translate(900,200) rotate(-7) skewY(-5) translate(-900,-200)" filter="url(#cardShadow)">
    <rect x="730" y="68" width="340" height="234" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <path d="M730,82 a14,14 0 0 1 14,-14 h312 a14,14 0 0 1 14,14 v22 h-340 z" fill="#0b1120"/>
    <circle cx="748" cy="86" r="5" fill="#ef4444"/>
    <circle cx="766" cy="86" r="5" fill="#f59e0b"/>
    <circle cx="784" cy="86" r="5" fill="#22c55e"/>
    <rect x="800" y="78" width="220" height="16" rx="8" fill="#1e293b"/>
    <text x="810" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">eventx.app/events/summer-fest</text>

    <rect x="744" y="112" width="150" height="60" rx="8" fill="url(#thumb1)"/>
    <rect x="906" y="112" width="150" height="60" rx="8" fill="url(#thumb2)"/>
    <rect x="744" y="182" width="150" height="60" rx="8" fill="url(#thumb3)"/>
    <rect x="906" y="182" width="150" height="60" rx="8" fill="url(#thumb4)"/>

    <g fill="#ffffff" fill-opacity="0.85">
      <rect x="752" y="150" width="60" height="6" rx="3"/>
      <rect x="914" y="150" width="60" height="6" rx="3"/>
      <rect x="752" y="220" width="60" height="6" rx="3"/>
      <rect x="914" y="220" width="60" height="6" rx="3"/>
    </g>

    <rect x="744" y="258" width="312" height="10" rx="5" fill="#1e293b"/>
    <rect x="744" y="258" width="212" height="10" rx="5" fill="url(#progressGrad)"/>
    <text x="744" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">78% booked &#8226; live seat locks active</text>
  </g>

  <!-- Floating e-ticket card -->
  <g transform="translate(650,296) rotate(6) translate(-650,-296)" filter="url(#ticketShadow)">
    <rect x="558" y="250" width="200" height="92" rx="12" fill="url(#ticketGrad)" stroke="#ffffff" stroke-opacity="0.25"/>
    <line x1="660" y1="250" x2="660" y2="342" stroke="#ffffff" stroke-opacity="0.4" stroke-dasharray="4 4"/>

    <text x="570" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">EVENTX</text>
    <text x="570" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#e0f2fe">SEAT GA-12</text>
    <text x="570" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#bae6fd">SUMMER FEST '26</text>
    <text x="570" y="315" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#bae6fd" opacity="0.85">13 AUG 2026</text>

    <circle cx="578" cy="329" r="7" fill="#22c55e"/>
    <path d="M574,329 l3,3 l6,-7" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="672" y="258" width="76" height="76" rx="6" fill="#f8fafc"/>
    <rect x="678" y="262" width="24" height="24" fill="#0f172a"/>
    <rect x="718" y="262" width="24" height="24" fill="#0f172a"/>
    <rect x="678" y="302" width="24" height="24" fill="#0f172a"/>
    <rect x="686" y="270" width="8" height="8" fill="#f8fafc"/>
    <rect x="726" y="270" width="8" height="8" fill="#f8fafc"/>
    <rect x="686" y="310" width="8" height="8" fill="#f8fafc"/>

    <g fill="#0f172a">
      <rect x="702" y="262" width="8" height="8"/>
      <rect x="710" y="270" width="8" height="8"/>
      <rect x="702" y="278" width="8" height="8"/>
      <rect x="710" y="286" width="8" height="8"/>
      <rect x="678" y="286" width="8" height="8"/>
      <rect x="694" y="294" width="8" height="8"/>
      <rect x="710" y="294" width="8" height="8"/>
      <rect x="726" y="286" width="8" height="8"/>
      <rect x="734" y="294" width="8" height="8"/>
      <rect x="718" y="302" width="8" height="8"/>
      <rect x="726" y="310" width="8" height="8"/>
      <rect x="734" y="310" width="8" height="8"/>
      <rect x="702" y="310" width="8" height="8"/>
      <rect x="710" y="318" width="8" height="8"/>
      <rect x="686" y="302" width="8" height="8"/>
      <rect x="694" y="310" width="8" height="8"/>
      <rect x="678" y="310" width="8" height="8"/>
      <rect x="726" y="318" width="8" height="8"/>
    </g>
  </g>
</svg>
