<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Single-screen cinema marquee, film-reel motif">
  <title>Film — cinema marquee, film reel</title>
  <defs>
    <linearGradient id="filmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150A12"/>
      <stop offset="60%" stop-color="#2A0E1C"/>
      <stop offset="100%" stop-color="#4A1424"/>
    </linearGradient>
    <radialGradient id="marqueeGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E2A13A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E2A13A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A1B2C"/>
      <stop offset="50%" stop-color="#A32540"/>
      <stop offset="100%" stop-color="#7A1B2C"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#filmSky)"/>
  <rect width="1600" height="1000" fill="url(#marqueeGlow)"/>

  <!-- draped curtains, top corners -->
  <path d="M0,0 Q140,40 100,220 Q60,120 0,180 Z" fill="url(#curtain)" opacity="0.85"/>
  <path d="M1600,0 Q1460,40 1500,220 Q1540,120 1600,180 Z" fill="url(#curtain)" opacity="0.85"/>

  <!-- Cinema building silhouette (drawn first, sits behind the marquee) -->
  <g fill="#0A0509">
    <rect x="250" y="255" width="1100" height="745"/>
  </g>

  <!-- doorway glow -->
  <rect x="720" y="700" width="160" height="300" fill="#E2A13A" opacity="0.18"/>
  <rect x="720" y="700" width="160" height="300" fill="none" stroke="#E2A13A" stroke-opacity="0.4" stroke-width="4"/>

  <!-- marquee canopy, mounted in front of the facade -->
  <g>
    <rect x="380" y="110" width="840" height="115" rx="6" fill="#0F0810"/>
    <rect x="380" y="110" width="840" height="14" fill="#E2A13A"/>
    <!-- marquee bulbs -->
    <g fill="#FDE7B0">
      <circle cx="400" cy="140" r="6"/><circle cx="440" cy="140" r="6"/><circle cx="480" cy="140" r="6"/><circle cx="520" cy="140" r="6"/>
      <circle cx="560" cy="140" r="6"/><circle cx="600" cy="140" r="6"/><circle cx="640" cy="140" r="6"/><circle cx="680" cy="140" r="6"/>
      <circle cx="720" cy="140" r="6"/><circle cx="760" cy="140" r="6"/><circle cx="800" cy="140" r="6"/><circle cx="840" cy="140" r="6"/>
      <circle cx="880" cy="140" r="6"/><circle cx="920" cy="140" r="6"/><circle cx="960" cy="140" r="6"/><circle cx="1000" cy="140" r="6"/>
      <circle cx="1040" cy="140" r="6"/><circle cx="1080" cy="140" r="6"/><circle cx="1120" cy="140" r="6"/><circle cx="1160" cy="140" r="6"/>
      <circle cx="1200" cy="140" r="6"/>
    </g>
    <text x="800" y="195" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="6" fill="#E2A13A">NOW SHOWING</text>
  </g>

  <!-- floating film reel, gold line art -->
  <g transform="translate(1230,600)" stroke="#E2A13A" stroke-width="6" fill="none" opacity="0.85">
    <circle r="110"/>
    <circle r="24" fill="#0A0509" stroke-width="5"/>
    <circle cx="0" cy="-65" r="20"/><circle cx="56" cy="-32" r="20"/><circle cx="56" cy="32" r="20"/>
    <circle cx="0" cy="65" r="20"/><circle cx="-56" cy="32" r="20"/><circle cx="-56" cy="-32" r="20"/>
  </g>
</svg>
