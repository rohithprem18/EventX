<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Indian tech-city skyline at dusk, conference stage glow">
  <title>Tech — India tech-city skyline, summit venue</title>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="60%" stop-color="#101B33"/>
      <stop offset="100%" stop-color="#1C2A4A"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2A13A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E2A13A" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="towerFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3A5C"/>
      <stop offset="100%" stop-color="#141D33"/>
    </linearGradient>
    <linearGradient id="towerFaceNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37497A"/>
      <stop offset="100%" stop-color="#182545"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky2)"/>
  <rect y="500" width="1600" height="500" fill="url(#horizonGlow)"/>

  <!-- circuit-trace pattern, faint, upper sky -->
  <g stroke="#E2A13A" stroke-width="2" opacity="0.18" fill="none">
    <path d="M40,120 h180 v90 h140"/>
    <path d="M1420,80 h-160 v130 h-120 v90"/>
    <path d="M60,300 h120 v70 h200"/>
    <path d="M1500,260 h-140 v100 h-180"/>
    <circle cx="220" cy="210" r="5" fill="#E2A13A" stroke="none"/>
    <circle cx="360" cy="300" r="5" fill="#E2A13A" stroke="none"/>
    <circle cx="1260" cy="210" r="5" fill="#E2A13A" stroke="none"/>
    <circle cx="1180" cy="360" r="5" fill="#E2A13A" stroke="none"/>
  </g>

  <!-- Skyline: far row, muted -->
  <g fill="url(#towerFace)" opacity="0.65">
    <rect x="0" y="560" width="90" height="440"/>
    <rect x="150" y="480" width="70" height="520"/>
    <rect x="300" y="600" width="60" height="400"/>
    <rect x="1240" y="580" width="80" height="420"/>
    <rect x="1400" y="500" width="65" height="500"/>
    <rect x="1530" y="620" width="70" height="380"/>
  </g>

  <!-- Skyline: near row, brighter, taller — reads as a modern Indian tech-park cluster -->
  <g fill="url(#towerFaceNear)">
    <rect x="80" y="520" width="95" height="480"/>
    <rect x="200" y="640" width="60" height="360"/>
    <rect x="290" y="440" width="95" height="560"/>
    <rect x="410" y="560" width="65" height="440"/>
    <rect x="500" y="500" width="80" height="500"/>
    <rect x="600" y="610" width="55" height="390"/>
    <rect x="675" y="380" width="100" height="620"/>
    <rect x="800" y="530" width="70" height="470"/>
    <rect x="890" y="460" width="90" height="540"/>
    <rect x="1005" y="600" width="60" height="400"/>
    <rect x="1085" y="360" width="105" height="640"/>
    <rect x="1210" y="540" width="70" height="460"/>
    <rect x="1300" y="470" width="85" height="530"/>
    <rect x="1400" y="620" width="60" height="380"/>
    <rect x="1475" y="500" width="90" height="500"/>
  </g>

  <!-- lit windows, warm gold -->
  <g fill="#F2C879">
    <rect x="310" y="470" width="9" height="12"/><rect x="332" y="470" width="9" height="12"/><rect x="310" y="502" width="9" height="12"/><rect x="354" y="502" width="9" height="12"/>
    <rect x="690" y="410" width="10" height="13"/><rect x="718" y="410" width="10" height="13"/><rect x="746" y="440" width="10" height="13"/><rect x="690" y="470" width="10" height="13"/><rect x="718" y="500" width="10" height="13"/>
    <rect x="1100" y="390" width="10" height="13"/><rect x="1128" y="390" width="10" height="13"/><rect x="1156" y="420" width="10" height="13"/><rect x="1100" y="450" width="10" height="13"/><rect x="1128" y="480" width="10" height="13"/>
    <rect x="900" y="490" width="9" height="12"/><rect x="925" y="510" width="9" height="12"/><rect x="950" y="490" width="9" height="12"/><rect x="900" y="530" width="9" height="12"/>
    <rect x="1310" y="500" width="9" height="12"/><rect x="1335" y="520" width="9" height="12"/><rect x="1355" y="500" width="9" height="12"/><rect x="1310" y="540" width="9" height="12"/>
    <rect x="95" y="560" width="9" height="12"/><rect x="120" y="580" width="9" height="12"/><rect x="145" y="560" width="9" height="12"/>
  </g>
</svg>
