<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rangoli mandala art installation on a gallery wall">
  <title>Art — rangoli mandala, gallery wall</title>
  <defs>
    <linearGradient id="artBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0A16"/>
      <stop offset="100%" stop-color="#1E1226"/>
    </linearGradient>
    <radialGradient id="wallSpot" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#2A1B38" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E0A16" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#artBg)"/>
  <rect width="1600" height="1000" fill="url(#wallSpot)"/>

  <!-- floor line -->
  <line x1="0" y1="900" x2="1600" y2="900" stroke="#000" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Rangoli mandala, 12-fold symmetry -->
  <g transform="translate(800,470)">
    <circle r="320" fill="none" stroke="#E2A13A" stroke-width="3" opacity="0.35"/>
    <circle r="240" fill="none" stroke="#C12942" stroke-width="3" opacity="0.35"/>
    <circle r="150" fill="none" stroke="#E2A13A" stroke-width="3" opacity="0.4"/>

    <g id="petalset">
      <g transform="rotate(0)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#C12942" opacity="0.75"/></g>
      <g transform="rotate(30)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#E2A13A" opacity="0.75"/></g>
      <g transform="rotate(60)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#C12942" opacity="0.75"/></g>
      <g transform="rotate(90)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#E2A13A" opacity="0.75"/></g>
      <g transform="rotate(120)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#C12942" opacity="0.75"/></g>
      <g transform="rotate(150)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#E2A13A" opacity="0.75"/></g>
      <g transform="rotate(180)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#C12942" opacity="0.75"/></g>
      <g transform="rotate(210)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#E2A13A" opacity="0.75"/></g>
      <g transform="rotate(240)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#C12942" opacity="0.75"/></g>
      <g transform="rotate(270)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#E2A13A" opacity="0.75"/></g>
      <g transform="rotate(300)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#C12942" opacity="0.75"/></g>
      <g transform="rotate(330)"><path d="M0,-80 Q40,-160 0,-280 Q-40,-160 0,-80 Z" fill="#E2A13A" opacity="0.75"/></g>
    </g>

    <!-- small diya dots at cardinal points -->
    <g fill="#FDE7B0">
      <circle cx="0" cy="-320" r="8"/><circle cx="320" cy="0" r="8"/>
      <circle cx="0" cy="320" r="8"/><circle cx="-320" cy="0" r="8"/>
    </g>

    <circle r="55" fill="#E2A13A"/>
    <circle r="55" fill="none" stroke="#0E0A16" stroke-width="4"/>
    <circle r="20" fill="#7A1B2C"/>
  </g>

  <!-- gallery frame corner accents, subtle -->
  <g stroke="#E2A13A" stroke-width="2" opacity="0.25" fill="none">
    <path d="M60,60 h80 M60,60 v80"/>
    <path d="M1540,60 h-80 M1540,60 v80"/>
    <path d="M60,940 h80 M60,940 v-80"/>
    <path d="M1540,940 h-80 M1540,940 v-80"/>
  </g>
</svg>
