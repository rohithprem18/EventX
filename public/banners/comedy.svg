<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stand-up comedy club stage, warm spotlight on a mic stand">
  <title>Comedy — club stage, spotlit mic</title>
  <defs>
    <radialGradient id="spot" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#3A2418" stop-opacity="1"/>
      <stop offset="45%" stop-color="#1C1210" stop-opacity="1"/>
      <stop offset="100%" stop-color="#08070A" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="beamCone" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#E2A13A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E2A13A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="micShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A8F9A"/>
      <stop offset="50%" stop-color="#E7E9ED"/>
      <stop offset="100%" stop-color="#6B707A"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#spot)"/>

  <!-- brick wall texture, faint -->
  <g stroke="#000" stroke-opacity="0.35" stroke-width="2">
    <line x1="0" y1="120" x2="1600" y2="120"/><line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="280" x2="1600" y2="280"/><line x1="0" y1="360" x2="1600" y2="360"/>
    <line x1="80" y1="80" x2="80" y2="120"/><line x1="240" y1="80" x2="240" y2="120"/>
    <line x1="400" y1="80" x2="400" y2="120"/><line x1="560" y1="80" x2="560" y2="120"/>
    <line x1="160" y1="160" x2="160" y2="200"/><line x1="320" y1="160" x2="320" y2="200"/>
    <line x1="480" y1="160" x2="480" y2="200"/><line x1="640" y1="160" x2="640" y2="200"/>
    <line x1="960" y1="80" x2="960" y2="120"/><line x1="1120" y1="80" x2="1120" y2="120"/>
    <line x1="1280" y1="80" x2="1280" y2="120"/><line x1="1440" y1="80" x2="1440" y2="120"/>
    <line x1="1040" y1="160" x2="1040" y2="200"/><line x1="1200" y1="160" x2="1200" y2="200"/>
    <line x1="1360" y1="160" x2="1360" y2="200"/>
  </g>

  <!-- spotlight beam converging on the mic -->
  <polygon points="500,0 1100,0 940,860 660,860" fill="url(#beamCone)"/>

  <!-- bunting of round bulbs -->
  <g fill="#E2A13A" opacity="0.85">
    <path d="M0,60 Q400,140 800,60 Q1200,140 1600,60" fill="none" stroke="#C12942" stroke-width="3" opacity="0.6"/>
    <circle cx="120" cy="86" r="7"/><circle cx="260" cy="112" r="7"/><circle cx="400" cy="126" r="7"/>
    <circle cx="540" cy="112" r="7"/><circle cx="680" cy="86" r="7"/><circle cx="820" cy="86" r="7"/>
    <circle cx="960" cy="112" r="7"/><circle cx="1100" cy="126" r="7"/><circle cx="1240" cy="112" r="7"/>
    <circle cx="1380" cy="86" r="7"/><circle cx="1500" cy="70" r="7"/>
  </g>

  <!-- mic stand silhouette, center stage -->
  <g transform="translate(800,0)">
    <rect x="-6" y="420" width="12" height="440" fill="#20140F"/>
    <ellipse cx="0" cy="860" rx="70" ry="14" fill="#20140F"/>
    <line x1="-70" y1="856" x2="70" y2="856" stroke="#20140F" stroke-width="10"/>
    <rect x="-46" y="410" width="92" height="10" rx="5" fill="#20140F" transform="rotate(-8 0 415)"/>
    <g transform="rotate(-8 0 415) translate(38,375)">
      <rect x="-16" y="0" width="32" height="70" rx="16" fill="url(#micShine)"/>
      <rect x="-10" y="10" width="20" height="4" fill="#2A2E36" opacity="0.6"/>
      <rect x="-10" y="20" width="20" height="4" fill="#2A2E36" opacity="0.6"/>
      <rect x="-10" y="30" width="20" height="4" fill="#2A2E36" opacity="0.6"/>
      <rect x="-10" y="40" width="20" height="4" fill="#2A2E36" opacity="0.6"/>
    </g>
  </g>

  <!-- comedy mask motif, gold line art, floating upper-left -->
  <g transform="translate(190,150)" stroke="#E2A13A" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,60 Q-10,0 60,0 Q130,0 120,60 Q130,120 60,140 Q-10,120 0,60 Z"/>
    <path d="M25,50 Q35,40 45,50" /><path d="M75,50 Q85,40 95,50"/>
    <path d="M30,95 Q60,120 90,95"/>
  </g>
</svg>
