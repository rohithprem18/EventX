# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In the Render dashboard: New + > Blueprint > pick this repo. Render reads
# this file and provisions the service below; you still need to set
# DATABASE_URL and REDIS_URL yourself (Neon/Upstash aren't Render add-ons),
# see README "Deployment".
services:
  - type: web
    name: eventx-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # set manually — your Neon connection string
      - key: REDIS_URL
        sync: false # set manually — your Upstash connection string
      - key: CORS_ORIGIN
        sync: false # set manually — your deployed frontend's origin
      - key: NODE_VERSION
        value: 20
